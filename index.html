<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mountain Journal">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <title>Mountain Journal - EKV Trekking</title>
  
  <!-- Librería para generar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; background: linear-gradient(to bottom, #475569, #0f172a); min-height: 100vh; color: white; }
    .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
    .header { background: #1e293b; padding: 2rem; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); margin-bottom: 2rem; text-align: center; }
    .logo-container { width: 120px; height: 120px; margin: 0 auto 1rem; background: transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); border: none; overflow: hidden; }
    .logo-placeholder { font-size: 3rem; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2)); }
    .logo-container img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #cbd5e1; margin-bottom: 1.5rem; }
    .brand { padding-top: 1rem; border-top: 1px solid #475569; margin-top: 1.5rem; }
    .brand-label { font-size: 0.875rem; color: #fbbf24; margin-bottom: 0.2rem; }
    .brand-name { font-size: 1.5rem; font-weight: bold; color: #fcd34d; }
    .card { background: linear-gradient(135deg, var(--color-from), var(--color-to)); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.4); }
    .card-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .card-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 0.25rem; }
    .card-desc { font-size: 0.9rem; opacity: 0.9; }
    .card-amber { --color-from: #d97706; --color-to: #ea580c; }
    .card-purple { --color-from: #9333ea; --color-to: #db2777; }
    .card-green { --color-from: #059669; --color-to: #0d9488; }
    .card-slate { --color-from: #475569; --color-to: #334155; }
    .footer { text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #475569; font-size: 0.75rem; color: #94a3b8; }
    .footer-brand { color: #fbbf24; margin-top: 0.25rem; }
    .privacy-footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #475569; font-size: 0.8rem; line-height: 1.6; color: #64748b; }
    .privacy-footer p { margin-bottom: 0.75rem; }
    .privacy-footer p:last-child { margin-bottom: 0; }
    .back-button { display: flex; align-items: center; gap: 0.5rem; background: none; border: none; color: #fbbf24; font-size: 1rem; cursor: pointer; margin-bottom: 1.5rem; padding: 0.5rem; }
    .back-button:hover { color: #fcd34d; }
    h2 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .mood-section { margin-bottom: 1.5rem; }
    .mood-label { color: #cbd5e1; margin-bottom: 0.75rem; }
    .mood-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .mood-btn { background: #475569; border: none; border-radius: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; transition: all 0.2s; text-align: center; }
    .mood-btn:hover { background: #64748b; }
    .mood-btn.selected { background: var(--selected-color); transform: scale(1.1); }
    .mood-emoji { font-size: 2rem; margin-bottom: 0.25rem; }
    .mood-text { font-size: 0.75rem; color: white; }
    textarea { width: 100%; background: #1e293b; border: none; border-radius: 0.75rem; padding: 1rem; color: white; font-size: 1rem; font-family: inherit; resize: none; outline: none; }
    textarea:focus { box-shadow: 0 0 0 2px var(--focus-color); }
    textarea::placeholder { color: #94a3b8; }
    input { width: 100%; background: #1e293b; border: none; border-radius: 0.75rem; padding: 0.875rem 1rem; color: white; font-size: 1rem; font-family: inherit; outline: none; margin-bottom: 1rem; }
    input:focus { box-shadow: 0 0 0 2px #fbbf24; }
    input::placeholder { color: #94a3b8; }
    .save-btn { width: 100%; background: var(--btn-color); border: none; border-radius: 0.75rem; padding: 1rem; margin-top: 1.5rem; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s; }
    .save-btn:hover { filter: brightness(1.1); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .prompt-box { background: linear-gradient(135deg, #9333ea, #db2777); border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    .prompt-icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .prompt-text { font-size: 1.25rem; font-weight: 500; }
    .button-group { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .button-group button { flex: 1; padding: 1rem; border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: bold; cursor: pointer; color: white; transition: all 0.2s; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #64748b; }
    .gratitude-box { background: linear-gradient(135deg, #059669, #0d9488); border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    .gratitude-icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .gratitude-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; }
    .gratitude-desc { color: #d1fae5; }
    .gratitude-item { display: flex; gap: 0.75rem; margin-bottom: 1rem; align-items: flex-start; }
    .gratitude-number { background: #10b981; border-radius: 50%; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; margin-top: 0.5rem; }
    .gratitude-item textarea { flex: 1; height: 6rem; }
    .entry { background: #1e293b; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; }
    .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .entry-date { font-size: 0.875rem; color: #94a3b8; }
    .entry-mood { font-size: 2rem; }
    .entry-prompt { background: rgba(147, 51, 234, 0.2); border-left: 4px solid #a855f7; border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.75rem; }
    .entry-prompt-text { font-size: 0.875rem; color: #e9d5ff; }
    .entry-content { color: #e2e8f0; white-space: pre-wrap; margin-bottom: 0.75rem; line-height: 1.6; }
    .entry-gratitude { background: rgba(5, 150, 105, 0.2); border-left: 4px solid #10b981; border-radius: 0.5rem; padding: 0.75rem; }
    .entry-gratitude-title { font-size: 0.875rem; font-weight: 600; color: #6ee7b7; margin-bottom: 0.5rem; }
    .entry-gratitude-list { list-style: none; }
    .entry-gratitude-list li { font-size: 0.875rem; color: #a7f3d0; margin-bottom: 0.25rem; }
    .empty-state { text-align: center; padding: 3rem 0; }
    .empty-icon { font-size: 4rem; color: #475569; margin-bottom: 1rem; }
    .empty-text { color: #94a3b8; }
    .empty-subtext { color: #64748b; font-size: 0.875rem; margin-top: 0.5rem; }
    .cover { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 8px 16px rgba(0,0,0,0.4); border: 2px solid #475569; }
    .cover-header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid #475569; }
    .cover-title { font-size: 1.75rem; font-weight: bold; color: #fbbf24; margin-bottom: 0.5rem; }
    .cover-subtitle { color: #cbd5e1; font-size: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; color: #fbbf24; font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 500; }
    .date-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .trip-info-display { background: rgba(251, 191, 36, 0.1); border: 1px solid #fbbf24; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1.5rem; font-size: 0.875rem; }
    .trip-info-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: #cbd5e1; }
    .trip-info-row:last-child { margin-bottom: 0; }
    .trip-info-label { color: #fbbf24; font-weight: 500; }
    .send-btn { background: #10b981; margin-top: 1rem; }
    .send-btn:hover { background: #059669; }
    .success-message { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; border-radius: 0.75rem; padding: 1rem; margin-top: 1rem; color: #6ee7b7; text-align: center; }
    .error-message { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 0.75rem; padding: 1rem; margin-top: 1rem; color: #fca5a5; text-align: center; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJX4VzVjMjjTrH5ArbmLkOKJhf-7uFlbQQA50pFkmK4TmQIYluknr9DK5Qc1ub1biuzQ/exec';
    
    const prompts = ["¿Qué me enseñó la montaña hoy?","¿Qué sensaciones experimenté en el camino?","¿Cuál fue el momento más memorable del día?","¿Qué desafío superé hoy?","¿Cómo me siento al estar lejos de la ciudad?","¿Qué sonidos, olores o vistas me impactaron?","¿Qué aprendí sobre mí mismo/a hoy?","¿Por qué estoy agradecido/a en este momento?","¿Qué dejé ir hoy en la montaña?","¿Cómo me ha transformado este viaje hasta ahora?"];
    const moods = [{ emoji: '😊', label: 'Feliz', color: '#fbbf24' },{ emoji: '😌', label: 'Tranquilo', color: '#60a5fa' },{ emoji: '💪', label: 'Fuerte', color: '#10b981' },{ emoji: '🤔', label: 'Reflexivo', color: '#a855f7' },{ emoji: '😴', label: 'Cansado', color: '#6b7280' }];

    let currentView = 'cover';
    let tripInfo = { nombreViajero: '', lugarViaje: '', fechaDesde: '', fechaHasta: '', nombreGuia: '' };
    let entries = [];
    let currentEntry = '';
    let currentPrompt = '';
    let gratitudeItems = ['', '', ''];
    let currentMood = null;
    let isSending = false;
    let sendMessage = '';
    let firmaExcursionista = ''; // Nombre/apodo opcional para el PDF

    if ('serviceWorker' in navigator && !window.location.hostname.includes('claudeusercontent')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').then(reg => console.log('✅ SW OK')).catch(err => console.log('SW not available'));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

    function loadData() {
      try {
        const savedEntries = localStorage.getItem('journal-entries');
        if (savedEntries) entries = JSON.parse(savedEntries);
        const savedTripInfo = localStorage.getItem('trip-info');
        if (savedTripInfo) { tripInfo = JSON.parse(savedTripInfo); currentView = 'home'; }
      } catch (error) { console.log('No hay datos previos'); }
    }

    function saveEntries() { localStorage.setItem('journal-entries', JSON.stringify(entries)); }
    function saveTripInfo() { localStorage.setItem('trip-info', JSON.stringify(tripInfo)); }
    function getRandomPrompt() { return prompts[Math.floor(Math.random() * prompts.length)]; }

    function saveJournalEntry() {
      if (!currentEntry.trim() && !currentMood && gratitudeItems.every(item => !item.trim())) return;
      entries.unshift({ id: Date.now(), date: new Date().toISOString(), content: currentEntry, prompt: currentPrompt, mood: currentMood, gratitude: gratitudeItems.filter(item => item.trim()), type: currentView });
      saveEntries();
      currentEntry = ''; currentPrompt = ''; gratitudeItems = ['', '', ''];  currentMood = null; currentView = 'home';
      render();
    }

    async function generateDiaryPDF(fraseDestacada = '') {
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const margin = 20;
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        let yPos = margin;
        
        function checkNewPage(space) { if (yPos + space > pageHeight - margin) { doc.addPage(); yPos = margin; return true; } return false; }
        
        // ===== PORTADA MEJORADA =====
        // Fondo verde EKV
        doc.setFillColor(46, 125, 50);
        doc.rect(0, 0, pageWidth, 70, 'F');
        
        // Título sin emoji problemático
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(32);
        doc.setFont(undefined, 'bold');
        doc.text('MOUNTAIN JOURNAL', pageWidth / 2, 35, { align: 'center' });
        
        doc.setFontSize(14);
        doc.setFont(undefined, 'normal');
        doc.text('Diario de Montaña', pageWidth / 2, 50, { align: 'center' });
        
        // Intentar cargar logo (si existe)
        yPos = 85;
        try {
          const logoImg = new Image();
          logoImg.src = 'icon-192.png';
          await new Promise((resolve, reject) => {
            logoImg.onload = () => {
              doc.addImage(logoImg, 'PNG', pageWidth / 2 - 20, yPos, 40, 40);
              yPos += 50;
              resolve();
            };
            logoImg.onerror = () => {
              // Si no hay logo, solo continuar
              yPos += 10;
              resolve();
            };
            setTimeout(reject, 1000); // Timeout de 1 segundo
          }).catch(() => { yPos += 10; });
        } catch (e) {
          yPos += 10;
        }
        
        // Información del viaje
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(11);
        
        // Cuadro con info del viaje
        doc.setFillColor(250, 250, 250);
        doc.roundedRect(margin, yPos, pageWidth - 2 * margin, 55, 3, 3, 'F');
        yPos += 12;
        
        doc.setFont(undefined, 'bold');
        doc.setTextColor(46, 125, 50);
        doc.text('INFORMACION DEL VIAJE', pageWidth / 2, yPos, { align: 'center' });
        yPos += 10;
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        
        doc.setFont(undefined, 'bold');
        doc.text('Viajero/a:', margin + 10, yPos);
        doc.setFont(undefined, 'normal');
        doc.text(tripInfo.nombreViajero, margin + 35, yPos);
        yPos += 8;
        
        doc.setFont(undefined, 'bold');
        doc.text('Destino:', margin + 10, yPos);
        doc.setFont(undefined, 'normal');
        doc.text(tripInfo.lugarViaje, margin + 35, yPos);
        yPos += 8;
        
        doc.setFont(undefined, 'bold');
        doc.text('Fechas:', margin + 10, yPos);
        doc.setFont(undefined, 'normal');
        doc.text(`${tripInfo.fechaDesde} al ${tripInfo.fechaHasta}`, margin + 35, yPos);
        yPos += 8;
        
        doc.setFont(undefined, 'bold');
        doc.text('Guia:', margin + 10, yPos);
        doc.setFont(undefined, 'normal');
        doc.text(tripInfo.nombreGuia, margin + 35, yPos);
        yPos += 12;
        
        // Firma del excursionista (si existe)
        if (firmaExcursionista) {
          doc.setDrawColor(46, 125, 50);
          doc.setLineWidth(0.3);
          doc.line(margin + 10, yPos, pageWidth - margin - 10, yPos);
          yPos += 10;
          
          doc.setFont(undefined, 'italic');
          doc.setTextColor(46, 125, 50);
          doc.setFontSize(9);
          doc.text('Diario de:', margin + 10, yPos);
          doc.setFont(undefined, 'bold');
          doc.setFontSize(11);
          doc.text(firmaExcursionista, margin + 30, yPos);
          yPos += 10;
        } else {
          yPos += 3;
        }
        
        // Estadísticas del viaje
        const totalEntries = entries.length;
        const moodCounts = {};
        entries.forEach(e => {
          if (e.mood) {
            moodCounts[e.mood.label] = (moodCounts[e.mood.label] || 0) + 1;
          }
        });
        const gratitudeCount = entries.filter(e => e.gratitude && e.gratitude.length > 0).length;
        
        doc.setDrawColor(46, 125, 50);
        doc.setLineWidth(0.5);
        doc.line(margin, yPos, pageWidth - margin, yPos);
        yPos += 12;
        
        // Estadísticas
        doc.setFillColor(245, 250, 245);
        doc.roundedRect(margin, yPos, pageWidth - 2 * margin, 35, 3, 3, 'F');
        yPos += 10;
        
        doc.setFont(undefined, 'bold');
        doc.setTextColor(46, 125, 50);
        doc.setFontSize(10);
        doc.text('RESUMEN DE TU VIAJE', pageWidth / 2, yPos, { align: 'center' });
        yPos += 8;
        
        doc.setFont(undefined, 'normal');
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(9);
        doc.text(`Total de entradas: ${totalEntries}`, margin + 10, yPos);
        doc.text(`Entradas con gratitudes: ${gratitudeCount}`, pageWidth / 2 + 5, yPos);
        yPos += 6;
        
        // Mostrar moods más frecuentes
        const topMood = Object.keys(moodCounts).sort((a, b) => moodCounts[b] - moodCounts[a])[0];
        if (topMood) {
          doc.text(`Estado de animo predominante: ${topMood}`, margin + 10, yPos);
        }
        
        yPos += 15;
        
        // Mensaje de bienvenida
        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.setFont(undefined, 'italic');
        const welcomeText = 'Este diario contiene tus reflexiones y experiencias durante tu aventura en la montaña. Un recuerdo para toda la vida.';
        const lines = doc.splitTextToSize(welcomeText, pageWidth - 2 * margin);
        lines.forEach(line => { doc.text(line, pageWidth / 2, yPos, { align: 'center' }); yPos += 5; });
        
        // Marca EKV en portada
        yPos = pageHeight - 30;
        doc.setFontSize(12);
        doc.setTextColor(46, 125, 50);
        doc.setFont(undefined, 'bold');
        doc.text('EKV TREKKING Y SENDERISMO', pageWidth / 2, yPos, { align: 'center' });
        doc.setFontSize(8);
        doc.setFont(undefined, 'normal');
        doc.setTextColor(100, 100, 100);
        doc.text('Tu compañero de aventuras', pageWidth / 2, yPos + 6, { align: 'center' });
        
        // ===== ENTRADAS =====
        if (entries.length > 0) {
          doc.addPage();
          yPos = margin;
          
          // Encabezado de sección
          doc.setFillColor(46, 125, 50);
          doc.rect(0, yPos - 10, pageWidth, 20, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(18);
          doc.setFont(undefined, 'bold');
          doc.text('MIS REFLEXIONES', pageWidth / 2, yPos + 3, { align: 'center' });
          yPos += 25;
          doc.setTextColor(0, 0, 0);
          
          entries.forEach((entry, index) => {
            checkNewPage(60);
            
            // Encabezado de entrada
            doc.setFillColor(245, 245, 245);
            doc.roundedRect(margin, yPos - 8, pageWidth - 2 * margin, 14, 3, 3, 'F');
            
            doc.setFontSize(12);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(46, 125, 50);
            doc.text(`Entrada #${entries.length - index}`, margin + 5, yPos);
            
            // Fecha y estado de ánimo (SIN emoji)
            const entryDate = new Date(entry.date).toLocaleDateString('es-ES', { 
              day: 'numeric', 
              month: 'long', 
              year: 'numeric', 
              hour: '2-digit', 
              minute: '2-digit' 
            });
            const moodText = entry.mood ? `[${entry.mood.label}]` : '';
            
            doc.setFont(undefined, 'normal');
            doc.setTextColor(100, 100, 100);
            doc.setFontSize(9);
            doc.text(`${entryDate} ${moodText}`, pageWidth - margin - 5, yPos, { align: 'right' });
            yPos += 18;
            
            // Prompt (si existe)
            if (entry.prompt) {
              doc.setFillColor(245, 240, 255);
              doc.setDrawColor(167, 139, 250);
              doc.setLineWidth(0.5);
              
              const promptLines = doc.splitTextToSize('PREGUNTA: ' + entry.prompt, pageWidth - 2 * margin - 10);
              const promptHeight = promptLines.length * 5 + 10;
              checkNewPage(promptHeight);
              
              doc.roundedRect(margin + 5, yPos - 5, pageWidth - 2 * margin - 10, promptHeight, 2, 2, 'FD');
              doc.setTextColor(107, 70, 193);
              doc.setFontSize(9);
              doc.setFont(undefined, 'italic');
              
              promptLines.forEach(line => {
                doc.text(line, margin + 10, yPos);
                yPos += 5;
              });
              yPos += 10;
            }
            
            // Contenido
            if (entry.content) {
              doc.setTextColor(0, 0, 0);
              doc.setFont(undefined, 'normal');
              doc.setFontSize(10);
              
              const contentLines = doc.splitTextToSize(entry.content, pageWidth - 2 * margin - 10);
              contentLines.forEach(line => {
                checkNewPage(6);
                doc.text(line, margin + 5, yPos);
                yPos += 5;
              });
              yPos += 8;
            }
            
            // Gratitudes (si existen)
            if (entry.gratitude && entry.gratitude.length > 0) {
              checkNewPage(25);
              
              doc.setFillColor(240, 253, 244);
              doc.setDrawColor(16, 185, 129);
              doc.setLineWidth(0.5);
              
              const gratitudeHeight = entry.gratitude.length * 6 + 15;
              checkNewPage(gratitudeHeight);
              
              doc.roundedRect(margin + 5, yPos - 5, pageWidth - 2 * margin - 10, gratitudeHeight, 2, 2, 'FD');
              
              doc.setTextColor(5, 150, 105);
              doc.setFontSize(10);
              doc.setFont(undefined, 'bold');
              doc.text('GRATITUDES:', margin + 10, yPos);
              yPos += 8;
              
              doc.setFont(undefined, 'normal');
              doc.setFontSize(9);
              entry.gratitude.forEach((item, i) => {
                const gratLines = doc.splitTextToSize(`${i + 1}. ${item}`, pageWidth - 2 * margin - 20);
                gratLines.forEach(line => {
                  doc.text(line, margin + 15, yPos);
                  yPos += 5;
                });
              });
              yPos += 8;
            }
            
            // Línea separadora entre entradas
            yPos += 5;
            doc.setDrawColor(220, 220, 220);
            doc.setLineWidth(0.3);
            doc.line(margin + 10, yPos, pageWidth - margin - 10, yPos);
            yPos += 18;
          });
        }

    async function generateInspirationalQuote() {
      if (entries.length === 0) return '';
      
      // Recopilar todo el contenido del diario
      let diaryContent = '';
      entries.forEach((entry, index) => {
        if (entry.content) {
          diaryContent += `Entrada ${index + 1}: ${entry.content}\n\n`;
        }
        if (entry.gratitude && entry.gratitude.length > 0) {
          diaryContent += `Gratitudes: ${entry.gratitude.join(', ')}\n\n`;
        }
      });
      
      if (!diaryContent.trim()) return '';
      
      const systemPrompt = `Eres un editor experto en narrativa de montaña, trekking y experiencias de aventura.
Recibirás varias respuestas escritas por excursionistas durante un viaje de trekking. Estas respuestas provienen de un diario personal escrito durante la experiencia.
Tu tarea es crear UNA frase destacada que represente la esencia emocional del viaje y que sea ideal para compartirse en redes sociales junto a una foto de la aventura.

OBJETIVO DE LA FRASE: La frase debe transmitir inspiración, reflexión o superación personal asociada a la experiencia de caminar en la montaña.

PROCESO:
1. Analiza todas las respuestas del diario.
2. Identifica frases o fragmentos que contengan emociones, aprendizajes, descubrimientos o momentos significativos.
3. Selecciona la mejor frase disponible.
4. Si la frase original es demasiado larga, desordenada o débil, puedes resumirla o mejorar su redacción manteniendo su significado.
5. Si ninguna frase es lo suficientemente fuerte, combina ideas presentes en el texto para crear una frase breve y potente basada en esas ideas.
6. Nunca inventes experiencias que no estén reflejadas en el contenido.

CRITERIOS DE CALIDAD:
* Debe tener entre 8 y 18 palabras.
* Debe sonar auténtica, como algo que diría un excursionista real.
* Debe evocar aventura, aprendizaje, conexión con la naturaleza o superación.
* Debe ser inspiradora o reflexiva.
* Debe funcionar como una cita que alguien compartiría en Instagram o WhatsApp.
* Evita frases triviales, logísticas o negativas.
* Evita frases genéricas vacías como "la montaña es hermosa".
* Debe tener ritmo natural y ser fácil de leer.

FORMATO DE SALIDA:
Devuelve únicamente la frase final entre comillas.
No agregues explicaciones, etiquetas ni texto adicional.`;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            system: systemPrompt,
            messages: [
              { 
                role: "user", 
                content: `Aquí están las entradas del diario:\n\n${diaryContent}\n\nGenera la frase destacada.`
              }
            ],
          })
        });

        const data = await response.json();
        
        if (data.content && data.content.length > 0) {
          const quote = data.content.find(item => item.type === 'text');
          if (quote && quote.text) {
            // Limpiar comillas extras si las hay
            return quote.text.replace(/^["']|["']$/g, '').trim();
          }
        }
        
        return '';
      } catch (error) {
        console.error('Error generando frase:', error);
        return '';
      }
    }

});

const result = await response.json();

if (result.status !== "ok") {
  throw new Error("Error en servidor");
}
      } catch (e) {

      }
    }

    // 🟡 Frase IA
    let fraseDestacada = '';
    try {
      fraseDestacada = '';
    } catch (error) {
      console.log('No se pudo generar frase:', error);
    }

    // 🟣 PDF

      const fileName = await generateDiaryPDF(fraseDestacada);

  } catch (error) {

  }

  isSending = false; 
  render();
}

Message.startsWith('error:') ? `<div class="error-message">❌ ${sendMessage.split(':')[1]}</div>` : ''}` : ''}<button class="save-btn" style="--btn-color: #ef4444; margin-top: 2rem;" onclick="resetJournal()">🔄 Iniciar Nuevo Viaje</button><div class="footer"><p>Gracias por ser parte de esta aventura!</p><p class="footer-brand">EKV Trekking y Senderismo</p></div></div>`;
        tryLoadLogo();
