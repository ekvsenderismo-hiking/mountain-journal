<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mountain Journal - EKV Trekking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(to bottom, #475569, #0f172a);
      min-height: 100vh;
      color: white;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    
    header {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
            text-align: center;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: none;
            overflow: hidden;
        }

        .logo-placeholder {
            font-size: 2.5rem;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        .logo-container img {
            width: 120%;
            height: 120%;
            object-fit: cover;
            object-position: center;
        }

        .brand {
            display: block;
            font-size: 1rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }
    
    h1 {
      font-size: 2rem;
	  margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }
    
    .brand {
      padding-top: 1rem;
      border-top: 1px solid #475569;
      margin-top: 1.5rem;
    }
    
    .brand-label {
      font-size: 0.875rem;
      color: #fbbf24;
      margin-bottom: 0.2rem;
    }
    
    .brand-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fcd34d;
    }
    
    .card {
      background: linear-gradient(135deg, var(--color-from), var(--color-to));
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }
    
    .card-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    
    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }
    
    .card-desc {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    
    .card-amber { --color-from: #d97706; --color-to: #ea580c; }
    .card-purple { --color-from: #9333ea; --color-to: #db2777; }
    .card-green { --color-from: #059669; --color-to: #0d9488; }
    .card-slate { --color-from: #475569; --color-to: #334155; }
    
    .footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #475569;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    
    .footer-brand {
      color: #fbbf24;
      margin-top: 0.25rem;
    }
    
    .back-button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: none;
      color: #fbbf24;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 1.5rem;
      padding: 0.5rem;
    }
    
    .back-button:hover {
      color: #fcd34d;
    }
    
    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .mood-section {
      margin-bottom: 1.5rem;
    }
    
    .mood-label {
      color: #cbd5e1;
      margin-bottom: 0.75rem;
    }
    
    .mood-buttons {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    
    .mood-btn {
      background: #475569;
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .mood-btn:hover {
      background: #64748b;
    }
    
    .mood-btn.selected {
      background: var(--selected-color);
      transform: scale(1.1);
    }
    
    .mood-emoji {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }
    
    .mood-text {
      font-size: 0.75rem;
      color: white;
    }
    
    textarea {
      width: 100%;
      background: #1e293b;
      border: none;
      border-radius: 0.75rem;
      padding: 1rem;
      color: white;
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    
    textarea:focus {
      box-shadow: 0 0 0 2px var(--focus-color);
    }
    
    textarea::placeholder {
      color: #94a3b8;
    }
    
    input {
      width: 100%;
      background: #1e293b;
      border: none;
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      color: white;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      margin-bottom: 1rem;
    }
    
    input:focus {
      box-shadow: 0 0 0 2px #fbbf24;
    }
    
    input::placeholder {
      color: #94a3b8;
    }
    
    .save-btn {
      width: 100%;
      background: var(--btn-color);
      border: none;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-top: 1.5rem;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    
    .save-btn:hover {
      filter: brightness(1.1);
    }
    
    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .prompt-box {
      background: linear-gradient(135deg, #9333ea, #db2777);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .prompt-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    
    .prompt-text {
      font-size: 1.25rem;

    }
    
    .button-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    
    .button-group button {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: all 0.2s;
    }
    
    .btn-secondary {
      background: #475569;
    }
    
    .btn-secondary:hover {
      background: #64748b;
    }
    
    .gratitude-box {
      background: linear-gradient(135deg, #059669, #0d9488);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .gratitude-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    
    .gratitude-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    
    .gratitude-desc {
      color: #d1fae5;
    }
    
    .gratitude-item {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: flex-start;
    }
    
    .gratitude-number {
      background: #10b981;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
      margin-top: 0.5rem;
    }
    
    .gratitude-item textarea {
      flex: 1;
      height: 6rem;
    }
    
    .entry {
      background: #1e293b;
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    
    .entry-date {
      font-size: 0.875rem;
      color: #94a3b8;
    }
    
    .entry-mood {
      font-size: 2rem;
    }
    
    .entry-prompt {
      background: rgba(147, 51, 234, 0.2);
      border-left: 4px solid #a855f7;
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .entry-prompt-text {
      font-size: 0.875rem;
      color: #e9d5ff;
    }
    
    .entry-content {
      color: #e2e8f0;
      white-space: pre-wrap;
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }
    
    .entry-gratitude {
      background: rgba(5, 150, 105, 0.2);
      border-left: 4px solid #10b981;
      border-radius: 0.5rem;
      padding: 0.75rem;
    }
    
    .entry-gratitude-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #6ee7b7;
      margin-bottom: 0.5rem;
    }
    
    .entry-gratitude-list {
      list-style: none;
    }
    
    .entry-gratitude-list li {
      font-size: 0.875rem;
      color: #a7f3d0;
      margin-bottom: 0.25rem;
    }
    
    .empty-state {
      text-align: center;
      padding: 3rem 0;
    }
    
    .empty-icon {
      font-size: 4rem;
      color: #475569;
      margin-bottom: 1rem;
    }
    
    .empty-text {
      color: #94a3b8;
    }
    
    .empty-subtext {
      color: #64748b;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }
    
    .cover {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      border: 2px solid #475569;
    }
    
    .cover-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid #475569;
    }
    
    .cover-title {
      font-size: 1.75rem;
      font-weight: bold;
      color: #fbbf24;
      margin-bottom: 0.5rem;
    }
    
    .cover-subtitle {
      color: #cbd5e1;
      font-size: 1rem;
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    .form-label {
      display: block;
      color: #fbbf24;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    
    .date-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    
    .trip-info-display {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid #fbbf24;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }
    
    .trip-info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }

    }
    
    .trip-info-label {

      font-weight: 500;
    }

      margin-top: 1rem;
    }

      background: #059669;
    }

      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-top: 1rem;
      color: #6ee7b7;
      text-align: center;
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-top: 1rem;
      color: #fca5a5;
      text-align: center;
    }

<body>
  <div id="app"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMIJTJOAUWeqCatur3OjIOYpi5tMqQBAkqzj-ptp1BIg-fzCSmbHCKuGvLukQO26yj/exec';
    
    const prompts = [
      "¿Qué me enseñó la montaña hoy?",
      "¿Qué sensaciones experimenté en el camino?",
      "¿Cuál fue el momento más memorable del día?",
      "¿Qué desafío superé hoy?",
      "¿Cómo me siento al estar lejos de la ciudad?",
      "¿Qué sonidos, olores o vistas me impactaron?",
      "¿Qué aprendí sobre mí mismo/a hoy?",
      "¿Por qué estoy agradecido/a en este momento?",
      "¿Qué dejé ir hoy en la montaña?",
      "¿Cómo me ha transformado este viaje hasta ahora?"
    ];

    const moods = [
      { emoji: '😊', label: 'Feliz', color: '#fbbf24' },
      { emoji: '😌', label: 'Tranquilo', color: '#60a5fa' },
      { emoji: '💪', label: 'Fuerte', color: '#10b981' },
      { emoji: '🤔', label: 'Reflexivo', color: '#a855f7' },
      { emoji: '😴', label: 'Cansado', color: '#6b7280' }
    ];

    let currentView = 'cover';
    let tripInfo = {
      nombreViajero: '',
      lugarViaje: '',
      fechaDesde: '',
      fechaHasta: '',
      nombreGuia: ''
    };
    let entries = [];
    let currentEntry = '';
    let currentPrompt = '';
    let gratitudeItems = ['', '', ''];
    let currentMood = null;
    let isSending = false;
    let sendMessage = '';

    function loadData() {
      try {
        const savedEntries = localStorage.getItem('journal-entries');
        if (savedEntries) {
          entries = JSON.parse(savedEntries);
        }
        
        const savedTripInfo = localStorage.getItem('trip-info');
        if (savedTripInfo) {
          tripInfo = JSON.parse(savedTripInfo);
          currentView = 'home';
        }
      } catch (error) {
        console.log('No hay datos previos');
      }
    }

    function saveEntries() {
      try {
        localStorage.setItem('journal-entries', JSON.stringify(entries));
      } catch (error) {
        console.error('Error guardando entradas:', error);
      }
    }
    
    function saveTripInfo() {
      try {
        localStorage.setItem('trip-info', JSON.stringify(tripInfo));
      } catch (error) {
        console.error('Error guardando info del viaje:', error);
      }
    }

    function getRandomPrompt() {
      return prompts[Math.floor(Math.random() * prompts.length)];
    }

    function saveJournalEntry() {
      if (!currentEntry.trim() && !currentMood && gratitudeItems.every(item => !item.trim())) {
        return;
      }

      const newEntry = {
        id: Date.now(),
        date: new Date().toISOString(),
        content: currentEntry,
        prompt: currentPrompt,
        mood: currentMood,
        gratitude: gratitudeItems.filter(item => item.trim()),
        type: currentView
      };

      entries.unshift(newEntry);
      saveEntries();

      currentEntry = '';
      currentPrompt = '';
      gratitudeItems = ['', '', ''];
      currentMood = null;
      currentView = 'home';
      render();
    }

    async function sendToGoogleSheets() {
      if (entries.length === 0) {
        sendMessage = 'error:No hay entradas para enviar';
        render();
        return;
      }
      
      isSending = true;
      sendMessage = '';
      render();
      
      try {
        for (const entry of entries) {
          const data = {
            nombreViajero: tripInfo.nombreViajero,
            lugarViaje: tripInfo.lugarViaje,
            fechaDesde: tripInfo.fechaDesde,
            fechaHasta: tripInfo.fechaHasta,
            nombreGuia: tripInfo.nombreGuia,
            mood: entry.mood ? entry.mood.emoji + ' ' + entry.mood.label : '',
            tipoEntrada: entry.type,
            prompt: entry.prompt || '',
            contenido: entry.content || '',
            gratitudes: entry.gratitude ? entry.gratitude.join('; ') : ''
          };
          
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
          });
        }
        
        sendMessage = 'success:¡Respuestas enviadas correctamente!';
      } catch (error) {
        console.error('Error:', error);
        sendMessage = 'error:Error al enviar. Verifica tu conexión.';
      }
      
      isSending = false;
      render();
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const options = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
      return date.toLocaleDateString('es-ES', options);
    }

              <h1>Mountain Journal</h1>
              <p class="subtitle">Tu espacio de reflexión en las alturas</p>
              <div class="brand">
                <p class="brand-label">Una experiencia de</p>
                <p class="brand-name">EKV Trekking y Senderismo</p>
              </div>
            </div>

            <div class="trip-info-display">
              <div class="trip-info-row">
                <span class="trip-info-label">Viajero/a:</span>
                <span>${tripInfo.nombreViajero}</span>
              </div>
              <div class="trip-info-row">
                <span class="trip-info-label">Destino:</span>
                <span>${tripInfo.lugarViaje}</span>
              </div>
              <div class="trip-info-row">
                <span class="trip-info-label">Fechas:</span>
                <span>${tripInfo.fechaDesde} / ${tripInfo.fechaHasta}</span>
              </div>
              <div class="trip-info-row">
                <span class="trip-info-label">Guía:</span>
                <span>${tripInfo.nombreGuia}</span>
              </div>
            </div>

            <div class="card card-amber" onclick="goToView('freewrite')">
              <div class="card-icon">✏️</div>
              <div class="card-title">Escritura Libre</div>
              <div class="card-desc">Escribe lo que sientes, sin restricciones</div>
            </div>

            <div class="card card-purple" onclick="goToPrompt()">
              <div class="card-icon">✨</div>
              <div class="card-title">Prompt del Día</div>
              <div class="card-desc">Deja que una pregunta guíe tu reflexión</div>
            </div>

            <div class="card card-green" onclick="goToView('gratitude')">
              <div class="card-icon">❤️</div>
              <div class="card-title">Gratitud</div>
              <div class="card-desc">¿Por qué estás agradecido/a hoy?</div>
            </div>

            <div class="card card-slate" onclick="goToView('history')">
              <div class="card-icon">📋</div>
              <div class="card-title">Mis Entradas</div>
              <div class="card-desc">${entries.length} reflexiones guardadas</div>
            </div>

            ${entries.length > 0 ? `
              <button class="save-btn send-btn" onclick="sendToGoogleSheets()" ${isSending ? 'disabled' : ''}>
                ${isSending ? '⏳ Enviando...' : '📤 Enviar Respuestas'}
              </button>
              
              ${sendMessage.startsWith('success:') ? `
                <div class="success-message">✅ ${sendMessage.split(':')[1]}</div>
              ` : ''}
              
              ${sendMessage.startsWith('error:') ? `
                <div class="error-message">❌ ${sendMessage.split(':')[1]}</div>
              ` : ''}
            ` : ''}

            <button class="save-btn" style="--btn-color: #ef4444; margin-top: 2rem;" onclick="resetJournal()">
              🔄 Iniciar Nuevo Viaje
            </button>

            <div class="footer">
              <p>Gracias por ser parte de esta aventura!</p>
              <p class="footer-brand">EKV Trekking y Senderismo</p>

                <p style="color: #475569;">Mountain Journal © 2026 EKV - Todos los derechos reservados</p>
              </div>
            </div>
          </div>
        `;
      } else if (currentView === 'freewrite') {
        app.innerHTML = `
          <div class="container">
            <button class="back-button" onclick="goToView('home')">← Volver</button>
            <h2>Escritura Libre</h2>
            <div class="mood-section">
              <p class="mood-label">¿Cómo te sientes?</p>
              <div class="mood-buttons">
                ${moods.map(mood => `
                  <button class="mood-btn ${currentMood?.label === mood.label ? 'selected' : ''}" 
                          style="--selected-color: ${mood.color}"
                          onclick='selectMood(${JSON.stringify(mood)})'>
                    <div class="mood-emoji">${mood.emoji}</div>
                    <div class="mood-text">${mood.label}</div>
                  </button>
                `).join('')}
              </div>
            </div>
            <textarea rows="15" placeholder="Empieza a escribir... ¿Qué viviste hoy? ¿Qué sentiste?" style="--focus-color: #f59e0b" oninput="currentEntry = this.value">${currentEntry}</textarea>
            <button class="save-btn" style="--btn-color: #f59e0b" onclick="saveJournalEntry()">💾 Guardar Entrada</button>
          </div>
        `;
      } else if (currentView === 'prompt') {
        app.innerHTML = `
          <div class="container">
            <button class="back-button" onclick="goToView('home')" style="color: #c084fc">← Volver</button>
            <div class="prompt-box">
              <div class="prompt-icon">✨</div>
              <p class="prompt-text">${currentPrompt}</p>
            </div>
            <div class="mood-section">
              <p class="mood-label">¿Cómo te sientes?</p>
              <div class="mood-buttons">
                ${moods.map(mood => `
                  <button class="mood-btn ${currentMood?.label === mood.label ? 'selected' : ''}" 
                          style="--selected-color: ${mood.color}"
                          onclick='selectMood(${JSON.stringify(mood)})'>
                    <div class="mood-emoji">${mood.emoji}</div>
                    <div class="mood-text">${mood.label}</div>
                  </button>
                `).join('')}
              </div>
            </div>
            <textarea rows="12" placeholder="Escribe tu respuesta..." style="--focus-color: #a855f7" oninput="currentEntry = this.value">${currentEntry}</textarea>
            <div class="button-group">
              <button class="btn-secondary" onclick="changePrompt()">Otro Prompt</button>
              <button style="background: #a855f7" onclick="saveJournalEntry()">💾 Guardar</button>
            </div>
          </div>
        `;
      } else if (currentView === 'gratitude') {
        app.innerHTML = `
          <div class="container">
            <button class="back-button" onclick="goToView('home')" style="color: #34d399">← Volver</button>
            <div class="gratitude-box">
              <div class="gratitude-icon">❤️</div>
              <div class="gratitude-title">Lista de Gratitud</div>
              <p class="gratitude-desc">Enumera 3 cosas por las que estás agradecido/a hoy</p>
            </div>
            <div class="mood-section">
              <p class="mood-label">¿Cómo te sientes?</p>
              <div class="mood-buttons">
                ${moods.map(mood => `
                  <button class="mood-btn ${currentMood?.label === mood.label ? 'selected' : ''}" 
                          style="--selected-color: ${mood.color}"
                          onclick='selectMood(${JSON.stringify(mood)})'>
                    <div class="mood-emoji">${mood.emoji}</div>
                    <div class="mood-text">${mood.label}</div>
                  </button>
                `).join('')}
              </div>
            </div>
            ${gratitudeItems.map((item, index) => `
              <div class="gratitude-item">
                <div class="gratitude-number">${index + 1}</div>
                <textarea placeholder="Agradecimiento ${index + 1}..." style="--focus-color: #10b981" oninput="updateGratitude(${index}, this.value)">${item}</textarea>
              </div>
            `).join('')}
            <button class="save-btn" style="--btn-color: #10b981" onclick="saveJournalEntry()">💾 Guardar Gratitudes</button>
          </div>
        `;
      } else if (currentView === 'history') {
        app.innerHTML = `
          <div class="container">
            <button class="back-button" onclick="goToView('home')">← Volver</button>
            <h2>Mis Entradas</h2>
            ${entries.length === 0 ? `
              <div class="empty-state">
                <div class="empty-icon">⛰️</div>
                <p class="empty-text">Aún no tienes entradas</p>
                <p class="empty-subtext">Empieza a escribir tu primera reflexión</p>
              </div>
            ` : entries.map(entry => `
              <div class="entry">
                <div class="entry-header">
                  <span class="entry-date">${formatDate(entry.date)}</span>
                  ${entry.mood ? `<span class="entry-mood">${entry.mood.emoji}</span>` : ''}
                </div>
                ${entry.prompt ? `
                  <div class="entry-prompt">
                    <p class="entry-prompt-text">${entry.prompt}</p>
                  </div>
                ` : ''}
                ${entry.content ? `<p class="entry-content">${entry.content}</p>` : ''}
                ${entry.gratitude && entry.gratitude.length > 0 ? `
                  <div class="entry-gratitude">
                    <p class="entry-gratitude-title">Gratitudes:</p>
                    <ul class="entry-gratitude-list">
                      ${entry.gratitude.map(item => `<li>• ${item}</li>`).join('')}
                    </ul>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function startJourney() {
      if (!tripInfo.nombreViajero || !tripInfo.lugarViaje) {
        alert('Por favor completa al menos tu nombre y el lugar del viaje');
        return;
      }
      saveTripInfo();
      currentView = 'home';
      render();
    }

    function goToView(view) {
      currentView = view;
      render();
    }

    function goToPrompt() {
      currentPrompt = getRandomPrompt();
      currentView = 'prompt';
      render();
    }

    function changePrompt() {
      currentPrompt = getRandomPrompt();
      render();
    }

    function selectMood(mood) {
      currentMood = mood;
      render();
    }

    function updateGratitude(index, value) {
      gratitudeItems[index] = value;
    }

    function resetJournal() {
      if (confirm('¿Estás seguro? Esto borrará TODAS tus entradas y la información del viaje actual. Esta acción no se puede deshacer.')) {
        if (confirm('Última confirmación: ¿Realmente quieres borrar todo y comenzar un nuevo viaje?')) {
          localStorage.removeItem('journal-entries');
          localStorage.removeItem('trip-info');
          entries = [];
          tripInfo = {
            nombreViajero: '',
            lugarViaje: '',
            fechaDesde: '',
            fechaHasta: '',
            nombreGuia: ''
          };
          currentView = 'cover';
          sendMessage = '';
          render();
        }
      }
    }

    loadData();
    render();
  </script>
</body>
</html>
