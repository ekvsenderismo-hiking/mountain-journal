<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diario de montaña - Registra tus aventuras">
    <meta name="theme-color" content="#2e7d32">
    <title>Mountain Journal - Diario de Montaña</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mountain Journal">
    
    <!-- Iconos para iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #2e7d32;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2e7d32;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #1b5e20;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .status.success {
            background: #c8e6c9;
            color: #2e7d32;
            display: block;
        }
        
        .status.error {
            background: #ffcdd2;
            color: #c62828;
            display: block;
        }
        
        .install-prompt {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .install-prompt.show {
            display: block;
        }
        
        .install-prompt button {
            margin-top: 10px;
            background: #ffc107;
            color: #000;
        }
        
        .install-prompt button:hover {
            background: #ffb300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛰️ Mountain Journal</h1>
        <p class="subtitle">Registra tus aventuras en la montaña</p>
        
        <!-- Prompt de instalación -->
        <div id="installPrompt" class="install-prompt">
            <p>📱 ¡Instala esta app en tu dispositivo!</p>
            <button id="installButton">Instalar App</button>
        </div>
        
        <form id="journalForm">
            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="montaña">Nombre de la Montaña:</label>
                <input type="text" id="montaña" name="montaña" placeholder="Ej: Aconcagua" required>
            </div>
            
            <div class="form-group">
                <label for="altura">Altura (metros):</label>
                <input type="number" id="altura" name="altura" placeholder="Ej: 2500" required>
            </div>
            
            <div class="form-group">
                <label for="dificultad">Dificultad:</label>
                <select id="dificultad" name="dificultad" required>
                    <option value="">Selecciona...</option>
                    <option value="Fácil">Fácil</option>
                    <option value="Moderada">Moderada</option>
                    <option value="Difícil">Difícil</option>
                    <option value="Muy Difícil">Muy Difícil</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="clima">Clima:</label>
                <input type="text" id="clima" name="clima" placeholder="Ej: Soleado, nublado, lluvia...">
            </div>
            
            <div class="form-group">
                <label for="compañeros">Compañeros:</label>
                <input type="text" id="compañeros" name="compañeros" placeholder="Nombres de los compañeros">
            </div>
            
            <div class="form-group">
                <label for="notas">Notas y Experiencia:</label>
                <textarea id="notas" name="notas" placeholder="Describe tu experiencia..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">Guardar en Google Sheets</button>
        </form>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // ===============================================
        // CONFIGURACIÓN DE GOOGLE SHEETS
        // ===============================================
        // IMPORTANTE: Reemplaza esta URL con la URL de tu Google Apps Script
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkJ0rmBz2wOKBlw2GY8A24m_M875hlr24QqQ808KCrtFQgxm3YldN8NIk6TtXWivne5w/exec';
        
        // ===============================================
        // REGISTRO DEL SERVICE WORKER
        // ===============================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    console.log('Service Worker registrado:', registration);
                })
                .catch(error => {
                    console.log('Error al registrar Service Worker:', error);
                });
        }
        
        // ===============================================
        // INSTALACIÓN DE LA PWA
        // ===============================================
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installButton = document.getElementById('installButton');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            // Previene el prompt automático
            e.preventDefault();
            // Guarda el evento para usarlo después
            deferredPrompt = e;
            // Muestra el botón de instalación
            installPrompt.classList.add('show');
        });
        
        installButton.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Muestra el prompt de instalación
                deferredPrompt.prompt();
                // Espera la respuesta del usuario
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Usuario ${outcome === 'accepted' ? 'aceptó' : 'rechazó'} la instalación`);
                // Resetea la variable
                deferredPrompt = null;
                // Oculta el prompt
                installPrompt.classList.remove('show');
            }
        });
        
        // ===============================================
        // MANEJO DEL FORMULARIO
        // ===============================================
        const form = document.getElementById('journalForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        
        // Establecer fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validar que se haya configurado la URL
            if (GOOGLE_SCRIPT_URL === 'TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI') {
                showStatus('error', 'Error: Debes configurar la URL de Google Apps Script en el código');
                return;
            }
            
            // Deshabilitar botón
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            
            // Recopilar datos del formulario
            const formData = new FormData(form);
            const data = {
                fecha: formData.get('fecha'),
                montaña: formData.get('montaña'),
                altura: formData.get('altura'),
                dificultad: formData.get('dificultad'),
                clima: formData.get('clima'),
                compañeros: formData.get('compañeros'),
                notas: formData.get('notas'),
                timestamp: new Date().toISOString()
            };
            
            try {
                // Enviar a Google Sheets
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                // Nota: con mode: 'no-cors' no podemos leer la respuesta,
                // pero el dato se enviará correctamente
                showStatus('success', '✅ Entrada guardada exitosamente en Google Sheets');
                form.reset();
                document.getElementById('fecha').valueAsDate = new Date();
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('error', '❌ Error al enviar los datos. Verifica tu conexión.');
            } finally {
                // Rehabilitar botón
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar en Google Sheets';
            }
        });
        
        function showStatus(type, message) {
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            
            // Ocultar después de 5 segundos
            setTimeout(() => {
                statusDiv.className = 'status';
            }, 5000);
        }
    </script>
</body>
</html>
